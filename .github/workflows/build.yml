name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 编译安卓
  build-apk:
    name: Build apk
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - uses: actions/checkout@v3
      # 安装java 如果需要编译安卓
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # 安装Android SDK 如果需要编译安卓
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 linix 依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        run: flutter build apk --release --split-per-abi --dart-define=INIT_ENV=prod
  # 编译linux
  build-linux:
    name: Build Linux Amd64
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - uses: actions/checkout@v3
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 linix 依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        run: flutter build linux --release --dart-define=INIT_ENV=prod
  # 编译Web
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - uses: actions/checkout@v3
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 linix 依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        run: flutter build web --release --dart-define=INIT_ENV=prod --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/
  # 编译Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      # 拉取代码
      - uses: actions/checkout@v3
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 linix 依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        run: flutter build windows --release --dart-define=INIT_ENV=prod
  # 编译macos x86
  build-macos-amd64:
    name: Build Macos Amd64
    runs-on: macos-13
    steps:
      # 拉取代码
      - uses: actions/checkout@v3
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        run: flutter build macos --release --dart-define=INIT_ENV=prod
  # 编译macos arm64
  build-macos-arm64:
    name: Build Macos Arm64
    runs-on: macos-latest
    steps:
      # 拉取代码
      - uses: actions/checkout@v3
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        run: flutter build macos --release --dart-define=INIT_ENV=prod
  release:
    name: Release
    needs: [build-apk, build-linux, build-web, build-windows, build-macos-amd64, build-macos-arm64]
    runs-on: ubuntu-latest
