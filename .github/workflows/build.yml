name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 编译安卓
  build-apk:
    name: Build apk
    runs-on: ubuntu-latest
    steps:
      # 检测node版本号
      - run: |
          node -v
          npm -v
      # 拉取代码
      - uses: actions/checkout@main
      # 注入环境变量
      - run: node scripts/env
      - name: apply custom env
        run: cat .env >> $GITHUB_ENV
      # 测试是否生效
      - run: echo ${{ APP_VERSION }}
      # 安装java 如果需要编译安卓
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      # 安装Android SDK 如果需要编译安卓
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 flutter_distributor
      - name: Install flutter_distributor
        shell: bash
        run: dart pub global activate flutter_distributor
      # 安装 linix 依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        # run: flutter build apk --release --split-per-abi --dart-define=INIT_ENV=prod
        run: flutter_distributor package --platform android --targets apk --flutter-build-args=dart-define=INIT_ENV=prod --flutter-build-args=release
  # 编译linux
  build-linux:
    name: Build Linux Amd64
    runs-on: ubuntu-latest
    steps:
      # 检测node版本号
      - run: |
          node -v
          npm -v
      # 拉取代码
      - uses: actions/checkout@main
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 flutter_distributor
      - name: Install flutter_distributor
        shell: bash
        run: dart pub global activate flutter_distributor
      # 安装 linix 依赖 locate wget
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译ded
      - name: Build ded
        shell: bash
        run: flutter_distributor package --platform linux --targets deb
  # 编译Web
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      # 检测node版本号
      - run: |
          node -v
          npm -v
      # 拉取代码
      - uses: actions/checkout@main
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 linix 依赖
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 编译
      - name: Build
        shell: bash
        run: flutter build web --release --dart-define=INIT_ENV=prod --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/
  # 编译Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      # 检测node版本号
      - run: |
          node -v
          npm -v
      # 拉取代码
      - uses: actions/checkout@main
      # 注入环境变量
      - run: node scripts/env
      - name: apply custom env
        run: type .env >> $env:GITHUB_ENV
      # 测试是否生效
      - run: echo ${{ APP_VERSION }}
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装 flutter_distributor
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          # 设置环境变量
      # # 安装 InnoSetup
      # - name: Install InnoSetup
      #   uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # # 编译 msix
      # - name: Build Msix
      #   run: flutter_distributor package --platform windows --targets msix
      # 编译 exe
      - name: Build EXE
        run: flutter_distributor package --platform windows --targets exe
      # 查看
      - name: Show Files
        run: |
          dir dist/1.0.0+1
          dir build\windows\x64\runner\Release
  # 编译macos x86
  build-macos-amd64:
    name: Build Macos Amd64
    runs-on: macos-13
    steps:
      # 检测node版本号
      - run: |
          node -v
          npm -v
      # 拉取代码
      - uses: actions/checkout@main
      # 注入环境变量
      - run: node scripts/env
      - name: apply custom env
        run: cat .env >> $GITHUB_ENV
      # 测试是否生效
      - run: echo ${{ APP_VERSION }}
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 安装nodejs
      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # 安装 flutter_distributor
      - name: Install flutter_distributor
        shell: bash
        run: |
          dart pub global activate flutter_distributor
          npm install -g appdmg
      # 编译
      - name: Build
        shell: bash
        run: flutter_distributor package --platform macos --targets dmg
  # 编译macos arm64
  build-macos-arm64:
    name: Build Macos Arm64
    runs-on: macos-latest
    steps:
      # 检测node版本号
      - run: |
          node -v
          npm -v
      # 拉取代码
      - uses: actions/checkout@main
      # 注入环境变量
      - run: node scripts/env
      - name: apply custom env
        run: cat .env >> $GITHUB_ENV
      # 测试是否生效
      - run: echo ${{ APP_VERSION }}
      # 安装Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
      # 安装flutter依赖
      - name: Install dependencies
        run: flutter pub get
      # 安装nodejs
      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # 安装 flutter_distributor
      - name: Install flutter_distributor
        shell: bash
        run: |
          dart pub global activate flutter_distributor
          npm install -g appdmg
      # 编译
      - name: Build
        shell: bash
        run: flutter_distributor package --platform macos --targets dmg
  # release:
